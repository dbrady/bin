<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<%
extend ::Kramdown::Utils::Html
title = ''
h = @converter.root.children.find {|c| c.type == :header }
if h
  collector = lambda {|c| c.children.collect {|cc| cc.type == :text ? escape_html(cc.value, :text) : collector.call(cc) }.join('') }
  title = collector.call(h)
end
%>
<title><%= title %></title>
<style>
/* `color-scheme: light dark` opts the page into the OS theme, so the browser
   supplies both the background and the default text color. Every other color
   below is mixed from currentColor rather than hardcoded, which is what lets
   one stylesheet work in light and dark without a media query per rule. */
:root { color-scheme: light dark; }
body {
  max-width: 46rem; margin: 2.5rem auto; padding: 0 1.25rem;
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
h1 { font-size: 1.6rem; line-height: 1.25; margin-bottom: .25rem; }
h2 { font-size: 1.25rem; margin-top: 2.5rem; padding-bottom: .3rem;
     border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
h3 { font-size: 1.05rem; margin-top: 2rem; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .875em; }
code { background: color-mix(in srgb, currentColor 10%, transparent);
       padding: .15em .35em; border-radius: 3px; }
pre { background: color-mix(in srgb, currentColor 7%, transparent);
      padding: .85rem 1rem; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; }
blockquote { margin-left: 0; padding-left: 1rem;
             border-left: 3px solid color-mix(in srgb, currentColor 25%, transparent);
             opacity: .85; }
table { border-collapse: collapse; margin: 1rem 0; display: block; overflow-x: auto; }
th, td { border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
         padding: .4rem .7rem; text-align: left; }
<% if ENV['GFM_WIDE'] && !ENV['GFM_WIDE'].empty? %>
/* --wide: the 46rem column keeps prose readable, but wide tables and long code
   lines get columnized into a straw. Fixed px gutter, not % or em, so the text
   does not re-narrow as the window or font size grows. */
body { max-width: none; padding: 0 100px; }
<% end %>
</style>
</head>
<body>
<%= @body %>
</body>
</html>
